<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Multicompany Admin Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: single-screen admin app (navbar, page header, side tabs + content), modals over it, a floating test-script drawer */
:root{
  color-scheme: dark;
  --bg:#121214; --panel:#1a1a20; --panel-2:#222227; --line:#38383d; --line-soft:#2a2a2e;
  --fg:#f2f2f5; --fg-2:#d5d5de; --muted:#9494a1; --faint:#676770;
  --accent:#b9b8fe; --accent-ink:#17142b; --accent-soft:#2b2647;
  --ok:#5fd38d; --ok-soft:#173225; --warn:#f2c14e; --warn-soft:#352b12; --bad:#f07a6a; --bad-soft:#3a1c19; --info:#8fb4ff; --info-soft:#18233b;
  --danger:#d5584a;
  --sans:"Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
/* nav */
.nav{display:flex;align-items:center;gap:10px;height:64px;padding:12px max(24px, env(safe-area-inset-right,0px)) 12px max(24px, env(safe-area-inset-left,0px))}
.nav .btn{flex-shrink:0;height:40px;border-radius:4px;font-size:16px;font-weight:500;padding:0 16px}
.nav .btn.primary{padding:0 16px 0 12px}
.nav .btn.outline{border-color:var(--line);background:var(--bg)}
.nav .btn.outline:hover{background:var(--panel)}
.iconbtn{width:40px;height:40px;border-radius:4px;border:0;background:none;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn:hover{background:var(--panel)}
.navright{display:flex;align-items:center;gap:8px}
.navicons{display:flex;gap:4px;padding:0 8px}
.logo{display:flex;align-items:center;gap:12px}
.logo .wm{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:400;letter-spacing:-.01em;color:#fff}
.logo small{color:var(--muted);font-weight:500;font-size:14px}
.spacer{flex:1}
.btn{border:1px solid transparent;border-radius:6px;padding:7px 12px;background:var(--panel-2);color:var(--fg);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#2a2a33}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{background:#cbcafe}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.outline{background:transparent;border-color:var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:inherit}
.btn.primary[disabled]{background:#4a4760;color:#bdbbc9}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline;text-underline-offset:3px}
.main{padding:24px max(32px, env(safe-area-inset-right,0px)) 120px max(32px, env(safe-area-inset-left,0px));width:100%}
/* list */
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel);flex:1;min-width:0}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.count{color:var(--muted);font-size:13px}
.pcomp{max-width:260px;width:auto;min-width:200px}
.toolbar .search{min-width:220px}
.tablewrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--line-soft)}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#1a1a20}
tr.grouphead td{background:var(--panel)}
tr.child td{background:#17171c}
tr.child td:nth-child(2){padding-left:28px}
.idcell{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.copy{border:0;background:none;color:var(--faint);padding:2px;border-radius:4px;display:inline-flex}
.copy:hover{color:var(--fg);background:var(--panel-2)}
.cname{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;border:1px solid var(--line-soft);background:var(--bg);border-radius:999px;padding:0 8px;font-size:14px;color:var(--fg-2);white-space:nowrap}
.badge{display:inline-flex;align-items:center;height:24px;border-radius:999px;padding:0 8px;font-size:14px;border:1px solid transparent;white-space:nowrap}
.b-active{background:rgba(35,195,15,.05);border-color:rgba(10,210,5,.2);color:#b9efb7}
.b-susp{background:rgba(255,80,30,.04);border-color:rgba(255,55,5,.18);color:#ffb9ab}
.b-churn{background:var(--bg);border-color:var(--line-soft);color:var(--muted)}
.b-group{border:1px solid var(--line);color:var(--muted);font-size:11px}
.chev{display:inline-block;transition:transform .15s;color:var(--muted);margin-right:6px}
.chev.open{transform:rotate(90deg)}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
/* list (matches Figma) */
.listpage{display:flex;flex-direction:column;gap:24px;margin-top:16px}
.lt-tools{display:flex;gap:24px;align-items:center}
.lt-search{flex:1;min-width:0;display:flex;gap:8px;align-items:center;height:40px;padding:0 12px;border:1px solid var(--faint);border-radius:4px;background:rgba(0,0,0,.31);color:var(--faint)}
.lt-search:focus-within{border-color:var(--accent)}
.lt-search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--fg)}
.lt-search input::placeholder{color:var(--faint)}
.lt-tools .count{font-size:14px;color:var(--muted);white-space:nowrap}
.lt-wrap{margin:0 calc(-1 * max(32px, env(safe-area-inset-right,0px))) 0 calc(-1 * max(32px, env(safe-area-inset-left,0px)));padding:0 max(32px, env(safe-area-inset-right,0px)) 0 max(32px, env(safe-area-inset-left,0px));border:1px solid var(--line-soft);border-radius:8px;overflow-x:auto}
.lt{min-width:760px}
.lt-row{display:grid;grid-template-columns:85px minmax(160px,1fr) 184px 179px 179px;align-items:center;min-height:46px;padding:0 17px;border-bottom:1px solid var(--line-soft);font-size:14px}
.lt>.lt-row:last-child,.lt>.lt-group:last-child{border-bottom:0}
.lt-head{min-height:40px;background:var(--panel);font-size:12px;font-weight:500;color:var(--muted)}
.lt-row .id{font-size:12px;color:var(--muted)}
.lt-row .co{color:var(--accent);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:12px}
.lt-row .bgc{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:12px}
.lt-row .dash{font-size:12px;color:var(--muted)}
.lt-row.click{cursor:pointer}
.lt-row.click:hover{background:#18181b}
.lt-group{border:1px solid var(--line-soft);border-radius:4px;overflow:hidden;margin:0 -1px}
.lt-group+.lt-row,.lt-row+.lt-group{margin-top:0}
.lt-ghead{background:var(--line-soft);border-bottom:0}
.lt-ghead.click:hover{background:#303035}
.lt-ghead .gt{grid-column:1/4;display:flex;align-items:center;gap:12px;min-width:0}
.lt-ghead .gt b{font-weight:500;color:#fff}
.lt-ghead .gt .chv{color:var(--muted);display:inline-flex;transition:transform .15s}
.lt-ghead .gt .chv.closed{transform:rotate(-90deg)}
.lt-ghead .gc{font-size:12px;color:var(--muted);text-align:right}
.pg{display:inline-flex;align-items:center;gap:2px;height:22px;padding:0 6px;border-radius:999px;background:#1c1c1f;border:1px solid var(--line);font-size:12px;color:#fff;white-space:nowrap}
.lt-child{background:#1c1c1f;border-bottom:1px solid var(--line-soft)}
.lt-group .lt-child:last-child{border-bottom:0}
.lt-child.click:hover{background:#222226}
.lt-child .id{padding-left:24px}
.lt-ghead+.lt-child{border-top:0}
/* group page */
.pagehead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 0 14px;border-bottom:1px solid var(--line-soft);margin-bottom:18px}
.pagehead h1{font-size:18px;font-weight:500;margin:0;text-align:center;text-wrap:balance}
.back{background:none;border:0;color:var(--muted);justify-self:start;padding:4px 0}
.back:hover{color:var(--fg)}
.layout{display:grid;grid-template-columns:200px 1fr;gap:28px}
.tabs{display:flex;flex-direction:column;border-left:1px solid var(--line)}
.tab{background:none;border:0;text-align:left;padding:8px 14px;color:var(--fg);border-left:2px solid transparent;margin-left:-1px}
.tab:hover{background:var(--panel)}
.tab.on{border-left-color:var(--accent);color:var(--accent)}
.tab[disabled]{color:var(--faint);cursor:default}
.content{min-width:0;display:flex;flex-direction:column;gap:18px}
.meta{display:flex;gap:20px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.meta b{color:var(--fg);font-weight:500;margin-left:4px}
.sechead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sechead h2{font-size:15px;font-weight:500;margin:0}
.sechead .sub{color:var(--muted);font-size:13px}
.note{color:var(--faint);font-size:12px}
.alert{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--panel)}
.alert .t{font-weight:500}
.alert .d{color:var(--muted);font-size:13px}
.alert .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alert.info{background:var(--info-soft);border-color:#26355a}.alert.info .ic{color:var(--info)}
.alert.warn{background:var(--warn-soft);border-color:#4d3e17}.alert.warn .ic,.alert.warn .t{color:var(--warn)}.alert.warn .d{color:#e7d6a8}
.alert.bad{background:var(--bad-soft);border-color:#58271f}.alert.bad .ic,.alert.bad .t{color:var(--bad)}.alert.bad .d{color:#f1c3bb}
.alert.ok{background:var(--ok-soft);border-color:#215038}.alert.ok .ic,.alert.ok .t{color:var(--ok)}
.attn{display:flex;flex-direction:column;gap:12px}
.rowacts{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
td{white-space:nowrap}
.alert>div{min-width:0}
.u{text-decoration:underline;text-underline-offset:3px;color:var(--fg);background:none;border:0;padding:0}
/* subscription */
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:14px 18px;border-top:1px solid var(--line-soft)}
.card .row>div:first-child{min-width:0}
.card .row>.num,.card .row>.big{white-space:nowrap;text-align:right}
.card .row:first-child{border-top:0}
.big{font-size:26px;font-weight:600}
.strike{text-decoration:line-through;color:var(--faint);margin-right:6px;font-weight:400}
.disc{color:var(--ok);font-size:12px}
.addon{display:grid;grid-template-columns:20px 1fr 120px 110px 120px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft);font-size:13px}
.addon:first-of-type{border-top:0}
.addon.sub{color:var(--muted);padding-left:28px;grid-template-columns:1fr 120px 110px 120px}
.right{text-align:right}
.usage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px}
.usage>div{padding:14px 16px;border-left:1px solid var(--line-soft)}
.usage>div:first-child{border-left:0}
.bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin-top:10px}
.bar>span{display:block;height:100%;background:var(--accent)}
/* form */
.formgrid{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start}
.fsec{display:flex;flex-direction:column;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--line-soft)}
.fsec:last-child{border-bottom:0}
.fsec h3{margin:0;font-size:15px;font-weight:500}
.fsec .h{color:var(--muted);font-size:13px;margin-top:-8px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px}
.field label .opt{color:var(--muted);display:inline;padding:0;width:auto;background:none;border-radius:0}
.field .help{color:var(--muted);font-size:12px}
.field .err{color:var(--bad);font-size:12px;display:flex;gap:5px;align-items:center}
.field .okmsg{color:var(--ok);font-size:12px;display:flex;gap:5px;align-items:center}
.input,select.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;outline:none}
.input:focus{border-color:var(--accent)}
.input.bad{border-color:var(--bad)}
.input.good{border-color:var(--ok)}
.inwrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.inwrap:focus-within{border-color:var(--accent)}
.inwrap.bad{border-color:var(--bad)}.inwrap.good{border-color:var(--ok)}
.inwrap input{border:0;background:none;outline:none;flex:1;padding:8px 10px;min-width:0}
.inwrap .plain{border:0;background:none;color:var(--accent);padding:6px 10px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.inwrap .plain[disabled]{color:var(--faint);cursor:not-allowed}
.bucket{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.bucket .top{display:flex;justify-content:space-between;align-items:center}
.brow{display:grid;grid-template-columns:minmax(0,1.6fr) 100px minmax(0,1fr) 110px 32px;gap:8px;align-items:center}
.brow .price{text-align:right}
.toggle{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;font-size:13px;white-space:nowrap}
.toggle i{flex-shrink:0}
.toggle i{width:30px;height:16px;border-radius:999px;background:var(--line);position:relative;display:inline-block}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on i{background:var(--accent)}.toggle.on i::after{left:16px}
.icon-btn{border:1px solid var(--line);background:none;border-radius:6px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:hover{color:var(--fg)}
.summary{position:sticky;top:12px;border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.summary .line{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.summary .muted{color:var(--muted);font-size:12px}
.summary hr{border:0;border-top:1px solid var(--line-soft);margin:4px 0;width:100%}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(6,6,10,.62);display:flex;align-items:flex-start;justify-content:center;padding:max(60px, env(safe-area-inset-top,0px)) 16px 40px;overflow:auto;z-index:20}
.modal{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
.modal header h3{margin:0;font-size:16px;font-weight:500}
.modal .body{padding:0 20px 8px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px}
.x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:4px}
.select{position:relative}
.selbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;text-align:left}
.selbtn .ph{color:var(--faint)}
.selbtn>span{display:flex;align-items:center;gap:6px;min-width:0}
.selbtn>svg{flex-shrink:0}
.selbtn.bad{border-color:var(--bad)}
.menu{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#202027;border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.45);z-index:5;padding:6px}
.menu .s{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:6px;background:var(--bg)}
.menu .s input{border:0;background:none;outline:none;flex:1;min-width:0}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;height:36px;background:none;border:0;padding:0 10px;border-radius:6px;text-align:left}
.opt>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .r{flex-shrink:0}
.opt:hover,.opt:focus-visible{background:var(--panel-2)}
.opt .r{color:var(--faint);font-size:12px;font-family:var(--mono)}
.opt.new{border-top:1px solid var(--line-soft);border-radius:0 0 6px 6px;margin-top:4px;height:40px}
.opts{max-height:216px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
/* toast */
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#0d0d10;border:1px solid var(--line);border-radius:8px;padding:9px 14px;display:flex;gap:8px;align-items:center;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.toast .ic{color:var(--ok)}
/* tasks drawer */
.tasks{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:min(360px,calc(100% - 32px))}
.tasks .panel{background:#f4f3fb;color:#1d1b2b;border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.5);padding:14px 16px;display:flex;flex-direction:column;gap:10px;max-height:min(70vh,560px);overflow:auto}
.tasks .panel h4{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#5a5480}
.tasks ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:t}
.tasks li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:13px}
.tasks li input{margin-top:2px;accent-color:#5a4fd0}
.tasks li.done span{color:#8a86a3;text-decoration:line-through}
.tasks .toggleTasks{background:#f4f3fb;color:#1d1b2b;border:0;border-radius:999px;padding:9px 14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.45);float:right}
.tasks .fac{background:#e7e5f5;border-radius:8px;padding:8px 10px;font-size:12px;color:#3d3860}
.tasks .fac code{font-family:var(--mono)}
.tasks .row2{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tasks .row2 button{background:none;border:1px solid #c9c5e4;border-radius:6px;padding:4px 10px;color:#3d3860;font-size:12px}
/* metrics (matches Figma) */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line-soft)}
.subtab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 8px;font-size:14px;font-weight:500;color:var(--fg-2)}
.subtab.on{color:var(--accent);border-bottom-color:var(--accent)}
.mcard{border:1px solid var(--faint);border-radius:8px;padding:24px;background:var(--bg);overflow-x:auto}
.mcard h2{font-size:14px;font-weight:500;margin:0;color:#fff}
.mleg{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 20px;font-size:10px;color:var(--fg-2)}
.mleg span{display:inline-flex;align-items:center;gap:6px}.mleg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.mchart{display:grid;grid-template-columns:44px 1fr;grid-template-rows:240px auto;min-width:560px}
.yax{position:relative;font-size:10px;color:var(--muted)}
.yax span{position:absolute;right:12px;transform:translateY(50%)}
.plot{position:relative;border-bottom:1px solid var(--line)}

function listView(){
 const q=ui.q.trim().toLowerCase();
 const match=(g,c)=>!q||c.name.toLowerCase().includes(q)||String(c.id).includes(q)||g.hubspot.includes(q)||g.name.toLowerCase().includes(q);

 for(const g of data.groups){

const MCOL=['#8a82e9','#12a195','#c66843','#7ca7f0'];
const MMONTHS=['Nov 25','Dec 25','Jan 26','Feb 26','Mar 26','Apr 26','May 26','Jun 26','Jul 26','Aug 26','Sep 26','Oct 26'];
const kfmt=n=>n>=1000?(Math.round(n/100)/10).toString().replace(/\.0$/,'')+'K':String(n);
function metricsTab(g){const m=ui.metric||'conv';const cs=g.companies.filter(c=>c.status!=='Churned');
 const lim=g.sub?(m==='conv'?limits(g.sub).conv:limits(g.sub).ai):0;
 const u=data.usage[g.id];const last=u?(m==='conv'?u.conv:u.ai):Math.round((lim||(m==='conv'?8000:800))*.55);
 const jit=[1,1.02,.97,1.04,.93,1.05,1.08,1,.94,1.03,1.06,1];
 const w=cs.map((c,j)=>[.58,.27,.15,.1][j%4]);const ws=w.reduce((a,b)=>a+b,0)||1;
 const vals=MMONTHS.map((_,i)=>cs.map((c,j)=>{const start=j*2;if(i<start)return 0;const t=(i-start+1)/(12-start);return Math.round(last*(w[j]/ws)*Math.pow(t,1.4)*jit[(i+j)%12]);}));
 const tot=vals.map(v=>v.reduce((a,b)=>a+b,0));const mx=Math.max(lim,...tot,1);
 const p10=Math.pow(10,Math.floor(Math.log10(mx)));const top=Math.ceil(mx/(p10/2))*(p10/2);
 const ticks=[0,1,2,3,4].map(i=>top*i/4);
 const scope=cs.length>1?'all companies':esc((cs[0]||g.companies[0]).name);const title=(m==='conv'?'Conversations per month · ':'AI credits used per month · ')+scope;
 return `<div class="subtabs" role="tablist"><button class="subtab ${m==='conv'?'on':''}" role="tab" aria-selected="${m==='conv'}" data-a="mtab" data-m="conv">Conversations</button><button class="subtab ${m==='ai'?'on':''}" role="tab" aria-selected="${m==='ai'}" data-a="mtab" data-m="ai">AI credits</button></div>
 <div class="mcard"><h2>${title}</h2><div class="mleg">${cs.map((c,j)=>`<span><i style="background:${MCOL[j%4]}"></i>${esc(c.name)}</span>`).join('')}</div>
 <div class="mchart"><div class="yax">${ticks.map(t=>`<span style="bottom:${t/top*100}%">${kfmt(t)}</span>`).join('')}</div>
 <div class="plot">${ticks.slice(1).map(t=>`<div class="gl" style="bottom:${t/top*100}%"></div>`).join('')}${lim?`<div class="lim" style="bottom:${lim/top*100}%"><span>Plan limit · ${kfmt(lim)}</span></div>`:''}
 <div class="bars">${vals.map((v,i)=>`<div class="bslot" title="${MMONTHS[i]} · ${k(tot[i])}"><div class="bar" style="height:${tot[i]/top*100}%">${v.map((x,j)=>x?`<span style="--c:${MCOL[j%4]};flex:${x}"></span>`:'').join('')}</div></div>`).join('')}</div></div>
 <div class="xax">${MMONTHS.map(x=>`<span>${x}</span>`).join('')}</div></div></div>`;}

function addModal(m){const g=grp(ui.group);const q=(m.q||'').toLowerCase();

 body+=selector(m,{id:'a-sel',label:'Company',placeholder:'Select a company or create a new one',options:opts,selectedLabel:sel,searchPh:'Search by name or ID',newLabel:'Create new company',err:m.err.pick});

 else if(m.pick){const c=allCompanies().find(x=>x.id==m.pick);const from=c.group;
  if(from.companies.length===1)body+=alertHTML('warn',`The business group “${esc(from.name)}” will be deleted`,`${esc(c.name)} is the only company in it. After the move the group is deleted${from.sub?` and its subscription (${PLANS[from.sub.plan].name}) is canceled`:''}.`);

  if(g.sub){const seats=limits(g.sub).seats,used=g.companies.reduce((a,b)=>a+b.agents,0)+c.agents;if(used>seats)body+=alertHTML('warn',`${esc(g.name)} will go over its agent seats`,`With ${esc(c.name)} they’ll use ${used} of ${seats} shared seats. You can add it anyway and update the subscription later.`);}
 }
 const disabled=Object.values(m.err).some(Boolean);
 return modalShell(`Add company to ${esc(g.name)}`,body,`<button class="btn ghost" data-a="close">Cancel</button><button class="btn primary" data-a="doAdd" ${disabled?'disabled':''}>${m.pick==='__new'?'Create company':'Add company'}</button>`);}

/* ---------- actions ---------- */

const companyById=id=>allCompanies().find(c=>c.id==id);

const A={
 noop(){},
 mtab(el){ui.metric=el.dataset.m;},
 openCreate(){ui.modal={type:'create',bg:null,open:false,q:'',name:'',bgname:'',hsv:'',hs:{state:'idle'},err:{}};},

 back(){ui.view='list';ui.group=null;},

  if(!s.plan){ui.form.err.plan=true;ui.form.disabled=true;return;}
  if(!g.sub){const f=ui.form;f.saving=true;setTimeout(()=>{if(ui.form!==f)return;g.sub=clone(s);g.paused=false;ui.tab='subscription';ui.form=null;toast('Subscription created for '+g.name);render();},900);return;}
  const a=limits(g.sub),b=limits(s);const lower=b.conv<a.conv||b.ai<a.ai||b.seats<a.seats;const ca=cost(g.sub).total,cb=cost(s).total;
  const diff=`${fmt(ca)} → ${fmt(cb)} per cycle (${cb>=ca?'+':'−'}${fmt(Math.abs(Math.round((cb-ca)*100)/100))})`;

  let body=lower?alertHTML('warn','Takes effect on Dec 1, 2026',`${PLANS[g.sub.plan].name} → ${PLANS[s.plan].name} · ${diff}. ${PLANS[g.sub.plan].name} stays until then.`):alertHTML('info',`${PLANS[g.sub.plan].name} → ${PLANS[s.plan].name}`,diff+(g.companies.length>1?` · applies to all ${g.companies.length} companies`:''));
  if(lower&&below)body+=alertHTML('warn','Below current usage',`${k(u.conv)} conversations used this cycle; the new subscription includes ${k(b.conv)}.`);
  confirm({title:'Save changes?',body,ok:'Save changes',run(){if(lower){g.scheduled=clone(s);toast(`Changes saved · ${PLANS[s.plan].name} starts on Dec 1, 2026`);}else{g.sub=clone(s);toast('Subscription updated for '+g.name);}ui.tab='subscription';ui.form=null;}});},
 viewSched(){const g=grp(ui.group);const s=g.scheduled;ui.modal={type:'info',title:'Scheduled change',body:alertHTML('info',`${PLANS[g.sub.plan].name} → ${PLANS[s.plan].name} on Dec 1, 2026`,`${fmt(cost(g.sub).total)} → ${fmt(cost(s).total)} per cycle (${cost(s).total>=cost(g.sub).total?'+':'−'}${fmt(Math.abs(Math.round((cost(s).total-cost(g.sub).total)*100)/100))}). Scheduled by Lidia Paz on Nov 12.`),extra:`<button class="btn outline" data-a="cancelSched">Cancel scheduled change</button>`};},
 cancelSched(){const g=grp(ui.group);confirm({title:'Cancel scheduled change?',body:alertHTML('warn',`${esc(g.name)} stays on ${PLANS[g.sub.plan].name}`,`The change to ${PLANS[g.scheduled.plan].name} on Dec 1 won’t happen.`),cancel:'Keep change',ok:'Cancel change',danger:true,run(){g.scheduled=null;toast(`Scheduled change canceled · ${g.name} stays on ${PLANS[g.sub.plan].name}`);}});},
 suspend(el){const g=grp(ui.group);const c=g.companies.find(x=>x.id==el.dataset.c);const last=g.companies.filter(x=>x.status==='Active').length===1;
  confirm({title:`Suspend ${esc(c.name)}?`,body:alertHTML('warn',last?`${esc(c.name)} is the last active company`:`${esc(c.name)} will be deactivated for the customer`,(last&&g.sub?'Suspending it pauses the business group’s subscription. ':'')+'Its users can’t log in to Treble and its channels and agents stop working. It stays in Admin as Suspended and you can reactivate it later.'),ok:'Suspend company',run(){c.status='Suspended';if(last&&g.sub)g.paused=true;toast(c.name+' suspended');}});},
 reactivate(el){const g=grp(ui.group);const c=g.companies.find(x=>x.id==el.dataset.c);
  confirm({title:`Reactivate ${esc(c.name)}?`,body:alertHTML('info',`${esc(c.name)} will be active again`,'Its users can log in again, and its channels and agents come back as they were.'),ok:'Reactivate company',run(){c.status='Active';if(g.paused){g.paused=false;}toast(c.name+' reactivated');}});},

  confirm({title:`Churn ${esc(c.name)}?`,body:alertHTML('bad','This can’t be undone',(last&&g.sub?`${esc(c.name)} is the last active company, so the subscription will be canceled. `:'')+'Its users lose access to Treble for good. It stays in Admin as Churned.'),ok:'Churn company',danger:true,run(){c.status='Churned';if(last&&g.sub){g.sub=null;g.paused=false;g.scheduled=null;}toast(c.name+' churned');}});},
 openAdd(){ui.modal={type:'add',pick:null,open:false,q:'',name:'',err:{}};},
 openOwner(){ui.modal={type:'owner',pick:null,open:false,q:'',err:{}};},
 doOwner(){const m=ui.modal;const g=grp(ui.group);if(!m.pick){m.err={pick:'Select the new CS owner.'};m.open=false;return;}g.owner=m.pick;ui.modal=null;toast(`CS owner changed to ${m.pick} · updated in HubSpot`);},
 selToggle(){ui.modal.open=!ui.modal.open;ui.modal.q='';setTimeout(()=>{const i=document.querySelector('.menu input');if(i)i.focus();},0);},
 pick(el){const m=ui.modal;const v=el.dataset.v;if(m.type==='create'){m.bg=v;m.err={};}else{m.pick=v;m.err={};}m.open=false;
  setTimeout(()=>{const i=document.getElementById(m.type==='create'?'c-name':'a-name');if(i)i.focus();},0);},
 close(){ui.modal=null;},
 scrim(el,e){if(e.target===el)ui.modal=null;else return false;},
 confirmOk(){const run=ui.modal.run;ui.modal=null;run&&run();},
 checkHs(){const m=ui.modal;const v=m.hsv.trim();
  if(!/^\d+$/.test(v)){m.err.hs='HubSpot IDs only contain numbers.';m.hs={state:'idle'};return;}
  m.hs={state:'checking'};m.err.hs=null;
  setTimeout(()=>{if(ui.modal!==m||m.hsv.trim()!==v)return;
   const linked=data.groups.find(g=>g.hubspot===v);
   if(v==='99999999'){m.hs={state:'idle'};m.err.hs='No company with this ID in HubSpot.';}
   else if(v==='00000000'){m.hs={state:'idle'};m.err.hs='Couldn’t reach HubSpot. Try again in a few minutes.';}
   else if(linked){m.hs={state:'idle'};m.err.hs='Already linked to the business group '+linked.name+'.';}
   else{const nm=(m.bgname||m.name||'New company').trim();m.hs={state:'found',company:nm+' (HubSpot)'};m.err.hs=null;}
   render();},1000);},
 doCreate(){const m=ui.modal;const err={};
  if(!m.bg)err.bg='Select a business group or create a new one.';
  else{const nm=m.name.trim();
   const eg=m.bg!=='__new'&&grp(m.bg);
   if(!nm)err.name='Enter a company name.';else if(eg&&eg.companies.some(c=>c.name.toLowerCase()===nm.toLowerCase()))err.name=`${esc(eg.name)} already has a company named “${esc(nm)}”.`;else if(allCompanies().some(c=>c.name.toLowerCase()===nm.toLowerCase()))err.name=`A company named “${esc(nm)}” already exists.`;
   if(m.bg==='__new'){const bgn=(m.bgname.trim()||nm);
    if(bgn&&data.groups.some(g=>g.name.toLowerCase()===bgn.toLowerCase()))err.bgname=`A business group named “${esc(bgn)}” already exists. Pick it in Business group or use a different name.`;
    if(!m.hsv.trim())err.hs='Enter the HubSpot ID and check it.';else if(m.hs.state!=='found'&&!m.err.hs)err.hs=NEEDCHECK;else if(m.err.hs)err.hs=m.err.hs;}}
  if(Object.values(err).some(Boolean)){m.err=err;m.open=false;m.serverErr=null;return;}
  if(/fail/i.test(m.name)){m.serverErr='Couldn’t create the company';return;}
  const id=data.nextId++;const comp={id,name:m.name.trim(),status:'Active',users:0,agents:0};
  if(m.bg==='__new'){const gid='g'+id;data.groups.unshift({id:gid,name:m.bgname.trim()||m.name.trim(),hubspot:m.hsv.trim(),owner:'Lidia Paz',companies:[comp],sub:null,scheduled:null,paused:false});openGroup(gid);}
  else{const g=grp(m.bg);g.companies.push(comp);openGroup(g.id);}

 doAdd(){const m=ui.modal;const g=grp(ui.group);
  if(!m.pick){m.err={pick:'Select a company or create a new one.'};m.open=false;return;}
  if(m.pick==='__new'){const nm=(m.name||'').trim();if(!nm){m.err={name:'Enter a company name.'};return;}if(g.companies.some(c=>c.name.toLowerCase()===nm.toLowerCase())){m.err={name:`${esc(g.name)} already has a company named “${esc(nm)}”.`};return;}if(allCompanies().some(c=>c.name.toLowerCase()===nm.toLowerCase())){m.err={name:`A company named “${esc(nm)}” already exists.`};return;}
   if(/fail/i.test(nm)){m.serverErr='Couldn’t create the company';return;}
   g.companies.push({id:data.nextId++,name:nm,status:'Active',users:0,agents:0});ui.modal=null;toast(nm+' created in '+g.name);return;}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
 if(['fplan','pdisc','fstart','fseatp','pkg','bdisc','pcomp','selSearch','cname','cbgname','chs','aname','ffree','fpaid'].includes(a))return;
 if(el.closest('.tasks'))return;
 const fn=A[a];if(!fn)return;
 if(el.tagName==='BUTTON'&&el.disabled)return;
 const r=fn(el,e);if(r===false)return;e.preventDefault();render();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('[role=row][data-a]')){e.target.click();return;}if(e.key==='Escape'&&ui.modal){if(ui.modal.open){ui.modal.open=false;}else ui.modal=null;render();}});
document.addEventListener('input',e=>{const el=e.target;const a=el.dataset&&el.dataset.a;
 if(el.id==='q'){ui.q=el.value;render();return;}
 if(!a)return;const m=ui.modal;const f=ui.form;
 switch(a){
  case 'selSearch':m.q=el.value;break;
  case 'cname':m.name=el.value;m.err.name=null;if(m.err.bgname&&!m.bgname)m.err.bgname=null;break;
  case 'cbgname':m.bgname=el.value;m.err.bgname=null;break;
  case 'chs':m.hsv=el.value;if(m.err.hs!==NEEDCHECK)m.err.hs=null;m.hs={state:'idle'};break;
  case 'aname':m.name=el.value;m.err.name=null;break;
  case 'ffree':f.sub.freeSeats=Math.max(0,+el.value||0);break;
  case 'fpaid':f.sub.paidSeats=Math.max(0,+el.value||0);break;
  default:return;}
 render();});
document.addEventListener('change',e=>{const el=e.target;const a=el.dataset&&el.dataset.a;if(!a)return;const f=ui.form;
 switch(a){
  case 'fplan':f.sub.plan=el.value;f.err.plan=false;f.disabled=false;break;
  case 'pdisc':f.sub.planDiscount=+el.value;break;
  case 'fstart':f.sub.start=el.value;break;
  case 'fseatp':f.sub.seatPrice=+el.value;break;
  case 'pkg':{const t=el.dataset.type,i=+el.dataset.i;const [q,p]=(t==='conv'?CONV_PKG:AI_PKG).find(x=>x[0]==el.value);Object.assign(f.sub[t][i],{qty:q,price:p});break;}
  case 'bdisc':f.sub[el.dataset.type][+el.dataset.i].disc=+el.value;break;
  case 'pcomp':ui.people[ui.group]=+el.value;break;

/* ---------- tasks drawer ---------- */
function renderTasks(){const el=document.getElementById('tasks');
 if(!ui.tasksOpen){el.innerHTML=`<button class="toggleTasks" data-t="open">Test tasks (${Object.values(ui.done).filter(Boolean).length}/${TASKS.length})</button>`;return;}
 el.innerHTML=`<div class="panel"><div class="row2"><h4>Test tasks</h4><button data-t="close">Hide</button></div>
 <ol>${TASKS.map((t,i)=>`<li class="${ui.done[i]?'done':''}"><input type="checkbox" id="task-${i}" data-t="done" data-i="${i}" ${ui.done[i]?'checked':''}><label for="task-${i}"><span>${t}</span></label></li>`).join('')}</ol>
 <details class="fac"><summary>Facilitator notes</summary><p style="margin:6px 0 0">HubSpot test IDs: <code>99999999</code> not found · <code>21847503</code> already linked to Lumen Academy · <code>00000000</code> HubSpot doesn’t respond · any other number is found.</p><p style="margin:6px 0 0">A company name containing <code>fail</code> simulates a server error when creating it.</p></details>
 <div class="row2"><span style="font-size:12px;color:#6b6790">Nothing here is saved.</span><button data-t="reset">Reset prototype</button></div></div>`;}
document.getElementById('tasks').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=b.dataset.t;
 if(t==='open'){ui.tasksOpen=true;renderTasks();}
 else if(t==='close'){ui.tasksOpen=false;renderTasks();}
 else if(t==='reset'){data=initial();const done={};ui={view:'list',group:null,tab:'status',q:'',open:{},modal:null,form:null,people:{},tasksOpen:true,done};render();toast('Prototype reset');}
});
document.getElementById('tasks').addEventListener('change',e=>{const b=e.target;if(b.dataset.t==='done'){ui.done[b.dataset.i]=b.checked;renderTasks();}});
document.getElementById('modal').addEventListener('click',e=>{/* handled globally */});

render();
